services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${BLOG_DATABASE_NAME:-aelf_blog}
      POSTGRES_USER: ${BLOG_DATABASE_USERNAME:-aelf_blog}
      POSTGRES_PASSWORD: ${BLOG_DATABASE_PASSWORD:-aelf_blog}
    volumes:
      - aelf_blog_postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${BLOG_DATABASE_USERNAME:-aelf_blog} -d ${BLOG_DATABASE_NAME:-aelf_blog}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - aelf_blog

  strapi:
    build:
      context: ./cms
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./cms/.env
    environment:
      NODE_ENV: production
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${BLOG_DATABASE_NAME:-aelf_blog}
      DATABASE_USERNAME: ${BLOG_DATABASE_USERNAME:-aelf_blog}
      DATABASE_PASSWORD: ${BLOG_DATABASE_PASSWORD:-aelf_blog}
      DATABASE_SSL: "false"
    ports:
      - "1337:1337"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:1337/admin/init').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped
    networks:
      - aelf_blog

  website:
    image: node:20-alpine
    depends_on:
      strapi:
        condition: service_healthy
    working_dir: /opt/workspace/aelf-website
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_ENV: ${BLOG_NEXT_PUBLIC_APP_ENV:-production}
      STRAPI_API_URL: http://strapi:1337
      STRAPI_API_TOKEN: ${BLOG_STRAPI_API_TOKEN:-}
      STRAPI_REVALIDATE_SECRET: ${BLOG_STRAPI_REVALIDATE_SECRET:-local-docker-revalidate-secret}
      STRAPI_MEDIA_ORIGIN: ${STRAPI_MEDIA_ORIGIN:-https://s3.ap-east-1.amazonaws.com/aelf.com}
      BLOG_CANONICAL_ORIGIN: ${BLOG_CANONICAL_ORIGIN:-https://blog.aelf.com}
    command: ["yarn", "start"]
    volumes:
      - .:/opt/workspace/aelf-website
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/blog').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    networks:
      - aelf_blog

volumes:
  aelf_blog_postgres:

networks:
  aelf_blog:
    driver: bridge
